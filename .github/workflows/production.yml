name: production

# The mobile equivalent of the backend's verify -> test -> build -> migrate ->
# deploy pipeline, with one deliberate difference: deploy never runs by itself.
#
# A backend deploy can be rolled back by redeploying. An OTA update cannot: it
# reaches every installed phone on next launch, and there is no recall. So a
# push to production runs everything up to and including the compatibility
# gate, and stops. Publishing happens when a human starts this workflow by
# hand (Actions -> production -> Run workflow) and types "publish".
#
# GitHub Free does not offer branch protection or required reviewers on
# private repositories, so nothing here can enforce that production only
# receives reviewed commits. Treat the manual trigger as the gate.

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to send an OTA update to every installed phone'
        required: true
        default: ''
      platform:
        description: Platform to publish
        required: true
        default: android
        type: choice
        options: [android, all, ios]
      message:
        description: Update message shown in EAS
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  # Never let two publishes race the same channel.
  group: mobile-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn typecheck

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # This release line carries no Jest harness yet (it predates the one on
      # main). Rather than pretend, the step says so and the pipeline still
      # has a real gate in typecheck plus the compatibility check below.
      - name: Test
        run: yarn test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # Proves the exact bundle an update would carry actually compiles. A
      # publish that fails here would otherwise ship a broken bundle.
      - name: Export update bundle
        env:
          EXPO_PUBLIC_API_BASE_URL: https://backend.connekyt.com/api/remote
        run: npx expo export --platform android
      - uses: actions/upload-artifact@v4
        with:
          name: update-bundle
          path: dist
          retention-days: 7

  migrate:
    # The gate that keeps installed phones alive. See the script's header.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the script reads the installed build's commit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check OTA compatibility with the installed build
        run: node scripts/check-ota-compatibility.mjs

  deploy:
    needs: migrate
    # A push to production publishes automatically once every gate above has
    # passed, which is how the backend behaves. Put [skip publish] in the
    # commit subject for CI-only or docs commits. A manual run still works,
    # and without "publish" it is a dry run.
    if: >-
      github.ref == 'refs/heads/production' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        !contains(github.event.head_commit.message, '[skip publish]')))
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Running this workflow WITHOUT typing publish is a dry run: it proves the
      # token still authenticates and the gate passes, and publishes nothing.
      # That is the only way to rehearse a publish, since the real one cannot
      # be undone.
      - name: Announce mode
        env:
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "Mode: PUBLISH (automatic, push to production). Every installed phone gets this on next launch."
          elif [ "$CONFIRM" = "publish" ]; then
            echo "Mode: PUBLISH (manual). Every installed phone gets this on next launch."
          else
            echo "Mode: dry run. Nothing will be published."
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Require the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN missing::Create a robot access token at expo.dev and add it as the EXPO_TOKEN repository secret."
            exit 1
          fi
      - name: Re-check compatibility at publish time
        run: node scripts/check-ota-compatibility.mjs
      # Proves the secret authenticates before anything irreversible happens.
      - name: Check the Expo credential
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest whoami --non-interactive
      # The commit subject and the typed message arrive as env vars, never
      # interpolated into the shell, so a message cannot inject commands.
      - name: Publish OTA update
        if: github.event_name == 'push' || inputs.confirm == 'publish'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform || 'android' }}
          TYPED_MESSAGE: ${{ inputs.message }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="$TYPED_MESSAGE"
          if [ -z "$MSG" ]; then MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -1); fi
          echo "Publishing: $MSG"
          npx eas-cli@latest update --branch production --platform "$PLATFORM" --message "$MSG" --non-interactive
      - name: Show what phones will fetch
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update:list --branch production --limit 1 --non-interactive
      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'publish'
        run: |
          echo "Dry run finished: the credential works and the compatibility gate passed."
          echo "To publish, run this workflow again with confirm set to publish."
          echo "::notice title=Nothing published::This was a dry run; installed phones are untouched."

